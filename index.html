<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlueLib Catalogue</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top of the page: site name + navigation links -->
  <header>
    <h1>BlueLib</h1>
    <nav>
      <a href="#catalogue">Books</a>
      <a href="#add-book">Add Book</a>
    </nav>
  </header>

  <main>

    <!-- Section 1: search box, category filter and the book cards -->
    <section id="catalogue">
      <h2>Browse Books</h2>

      <div class="filters">
        <div class="field">
          <label for="search">Search by title</label>
          <input type="text" id="search" placeholder="Type a title...">
        </div>

        <div class="field">
          <label for="filter-category">Category</label>
          <select id="filter-category">
            <option value="All">All</option>
            <option value="IT">IT</option>
            <option value="Business">Business</option>
            <option value="Science">Science</option>
            <option value="Arts">Arts</option>
          </select>
        </div>
      </div>

      <!-- JavaScript puts the book cards inside this div -->
      <div id="book-list" class="book-grid"></div>
      <p id="empty-message" class="hidden">No books found.</p>
    </section>

    <!-- Section 2: form to add a new book -->
    <section id="add-book">
      <h2>Add a Book</h2>

      <!-- novalidate lets our own JavaScript show the error messages -->
      <form id="add-form" novalidate>
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" name="title">
        </div>

        <div class="field">
          <label for="author">Author</label>
          <input type="text" id="author" name="author">
        </div>

        <div class="field">
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="">-- Choose a category --</option>
            <option value="IT">IT</option>
            <option value="Business">Business</option>
            <option value="Science">Science</option>
            <option value="Arts">Arts</option>
          </select>
        </div>

        <div class="field">
          <label for="copies">Copies Available</label>
          <input type="number" id="copies" name="copies" min="0" step="1">
        </div>

        <button type="submit">Add Book</button>

        <!-- Messages (error or success) are shown here -->
        <p id="form-message" role="alert"></p>
      </form>
    </section>

  </main>

  <footer>
    <p>Student: YOUR NAME HERE | Student ID: YOUR ID HERE</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
